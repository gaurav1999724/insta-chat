# spec §71: Docker Compose services — app, postgres, redis.
#
# Quick start (see docs/DEPLOYMENT.md for the full walkthrough):
#   1. cp .env.docker.example .env.docker and fill in real values
#   2. docker compose --env-file .env.docker up -d postgres redis
#   3. (first run only, and after any new migration) from the HOST, with
#      DATABASE_URL pointed at postgres's exposed port:
#        npm run prisma:migrate:deploy
#        npm run prisma:seed   # optional — demo chat modes + sample data
#   4. docker compose --env-file .env.docker up --build app
#
# Migrations and seeding run from the HOST (against the compose-exposed
# Postgres port), not inside the `app` container — the production image is
# intentionally minimal (Next.js's standalone output, see Dockerfile) and
# doesn't ship the `prisma` CLI or `tsx`, only what's needed to run the
# already-built server.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-instamate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-instamate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-instamate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # A real, current Redis — not this project's dev-environment's bundled
    # Redis 3.2.100, which is too old for BullMQ (PROJECT_ANALYSIS.md §10,
    # docs/QUEUES.md).
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-instamate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-instamate}?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env.docker}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env.docker}

volumes:
  postgres_data:
